# 专家库 bundle patch —— 挂载 experts entry（宿主半：按需注入 + 专家工具/命令 + 设置项）。
# 由 dsh.profile.bundles + dsh plugin add 安装，勿手动插入主 profile patch。
#
# 这里的 config 是**部署默认层（base）**，并保持**中性**（不含任何个人路径/称呼）：
#   解析值 = schema 默认值 ← 本文件 base ← profile 的 cordis.patch.yml ← 设置页用户覆盖层
# 个性化（本人岗位 defaultDomain、全局激活哪些专家 enabledDomains/enabledExperts）请在
# **设置页**改（免重启），或在该 profile 的 cordis.patch.yml 里按 id 覆盖；不要改这里。
#
# 需求口径（2026-09-12 定）的四条规则在 config 注释里写明，便于交付时一眼看懂：
#   ① 上限**写死 4**（expertInjectMax: 4，2026-09-15 使用者定：设置页不提供该项，避免误调）；
#      注入按**会话阶段**分两态：首轮全景（命中专家全部给精简卡）+ 干活轮（判定要干活的给全文）；
#   ② 岗位关联（defaultDomain）只作**同证据时的排序先验**（平手时本域优先），不再决定是否注入；
#   ③ enabledDomains / enabledExperts 是可选的**收窄**（默认全量参与匹配 —— 若拿岗位当白名单，
#      跨域任务就命中不了本域之外的专家，例如"客户要做三级等保测评"会被本域售前挡住）；
#   ④ 未注入的专家走临时注入（/expert use <id>、expert_recall），不常驻上下文；
#   ⑤ **零命中不注入**：任务文本没有任何关键词命中时，本轮一位 persona 都不注入 ——
#      目录段仍每轮可见（模型可自行判断归属），需要方法时用 expert_recall 现取。
- insert:
    - id: experts
      name: 'dsh-experts'
      config:
        expertsEnabled: true      # 总开关（设置页可改，免重启）
        injectOrder: 480          # runtime 快照顺序：略早于记忆快照(500)，让"专家视角"先立起来（改动需重启）
        expertCatalogEnabled: true # 专家库目录段（systemPrompt.section，order 10150）：稳定段，列出六域成员与可用能力；不占每轮注入预算
        disciplineEnabled: true   # 交付层纪律块（systemPrompt.context，order 481）：从项目记忆读【纪律块 v1】，每轮注入、不随裁剪丢弃
        disciplineMemoryDir: ''   # 纪律块的记忆库根；留空 = 取 work-memory 的 memoryDir，再退 $DSH_HOME/memories/work-memory
        defaultDomain: 'infosec' # 本人岗位默认域（安装引导会问一次）。取值：infosec 信息安全 / accounting 财务 / hr 人力资源 / coding 代码编程 / finance 金融 / general 通用职能
        identityExpert: ''        # 可选常驻的身份专家（id）；**留空 = 不常驻**（身份由 work-memory 记忆承担）
        enabledDomains: ''        # 把匹配范围收窄到这些域（逗号分隔）；留空 = 全量参与（岗位只作排序先验）
        enabledExperts: ''        # 把匹配范围收窄到这些专家 id（逗号分隔）；留空 = 不收窄
        expertInjectMax: 4        # persona 软上限 **写死 4**（2026-09-15 主人定，设置页不提供该项）；0 = 不限；手改 settings.yaml 可收紧到 1–3
        expertSecondThreshold: 0.3 # **域专家**第 2/3 位的相对门槛（证据 ≥ 最强 × 该值）；2026-09-15 由 0.8 调为 0.3（0.8 时实测 70% 任务只命中 1 位）
        expertGeneralMax: 1       # **通用型专家**（核查/排版/文档/演示/设计）的独立配额与绝对门槛 —— 与域专家分开评分
        expertGeneralMinEvidence: 0.2
        skillInjectEnabled: true # 能力层指针（工具/技能）：从任务识别技能，只注入「去哪拿」的指针行；不占 expertInjectMax 配额
        skillBudgetChars: 300    # 能力层指针字符预算（约 3 条）；0 = 不注入指针
        expertInjectDetail: 'auto' # 注入形态：auto（默认，按**会话阶段**分两态：首轮全景=命中专家全给精简卡；后续干活轮=判定要干活的专家给全文）/ card（全精简卡）/ full（全文，旧行为逃生舱）
        expertInjectBudgetChars: 15000 # 每轮专家注入**字符上限**（2026-09-16 按**最大可能消费**定档：单篇全文上限 3600 × 位数硬边界 4 + 块头尾注与处理路径 ≈ 14850）；只作上限、**不再降级**，超出即截断并标注；安全红线 20000（任何形态含 full 都不得突破）
        expertFullHitMax: 2       # 干活轮给**全文**的位数：按证据取**最大 + 次大**（并列取任意两位，不设固定门槛）；2026-09-16 使用者定「最相关的两人全文」，硬边界 4
        expertShowBanner: true    # 注入时显示「当前专家视角」标识
        expertSetupDone: false    # 安装引导是否已问过本人岗位
