name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  modules:
    name: 子项目回归
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 子项目零运行时依赖：不装依赖，直接语法自检 + 跑各自回归
      - name: 语法自检（node --check 全量 JS）
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

      # 未定义标识符静态检查（T5-2）：`node --check` 只查语法，抓不到 `ENTRY_SEP is not defined`
      # 这类「引用了未声明也未 import 的名字」缺陷；这里用 tsc 的 checkJs，只认 TS2304 / TS2552。
      # 只在 CI 侧装 typescript 与 @types/node（本机无此依赖时脚本自行跳过，不把本地弄红）。
      - name: 未定义标识符静态检查（tsc --checkJs · 宿主侧 lib）
        run: |
          npm install -g typescript@5.6.3 @types/node@22
          DSH_TSC_ROOT="$(npm root -g)" node modules/work-personal-secretary/scripts/check-undefined.mjs --require-tsc --typeRoots "$(npm root -g)/@types"

      - name: 子项目回归
        run: |
          for t in $(git ls-files '*/scripts/regression.mjs'); do
            echo "== $t =="
            node "$t"
          done

      # 装载冒烟（mock ctx 真跑 apply）与共存契约（与 dsh-work-memory 同 ctx 注册，不冲突）
      - name: 装载冒烟与共存契约
        run: |
          for t in $(git ls-files '*/scripts/smoke-load.mjs' '*/scripts/coexist.mjs'); do
            echo "== $t =="
            node "$t"
          done

      # 集成体本体自测（各套读数见根 TEST-MATRIX.md；2026-09-17 实测：smoke-load 513 / probe 149 / install 244 / basedeck 415 / settings-api 112 / identity 73 / defaults 59）
      # 四套均自带夹具，全部建在 os.tmpdir() 下并自清理，不触碰真实 profile 与设置文件
      # 失败时逐套收集输出：写 ::error:: annotation 与 step summary（无日志权限也能定位）
      - name: 集成体本体自测
        run: |
          fail=0
          for t in $(git ls-files '*/scripts/*-test.mjs'); do
            echo "== $t =="
            if out=$(node "$t" 2>&1); then
              echo "$out" | tail -n 3
            else
              fail=1
              echo "$out" | tail -n 60
              detail=$(echo "$out" | grep -nE '❌|✗|FAIL|失败|Error|error|Assertion|expected|actual' | head -n 25 | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-1500)
              echo "::error title=本体自测失败：$t::$detail"
              { echo "### ❌ $t"; echo; echo '```'; echo "$out" | tail -n 40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi

      # dsh-doc-suite 是 Python 实现（Word/Excel/PPT/PDF），CI 只做语法自检；
      # 运行时就绪性（PyMuPDF/WPS COM 等）由使用者本机 doctor.py 判定（Linux runner 装不了 WPS）。
      - name: Python 语法自检（py_compile 全量 .py）
        run: |
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f"; done
          echo "Python 语法自检通过"

      # dsh-doc-suite 的 Python 侧单测（零第三方依赖：只用标准库 + 本模块 py）
      - name: Python 单元测试（dsh-doc-suite）
        run: |
          python3 modules/dsh-doc-suite/scripts/tests/test_python.py

      - name: 子项目必需文件自检
        run: |
          fail=0
          # 只检查子项目包（modules/<name>/package.json）；scripts/ 下的是随包运行时清单（如 media/runtime），
          # 不适用 README/CHANGELOG/LICENSE 门禁 —— 此缺陷此前被上一步「集成体本体自测」的红灯掩盖（2026-09-17 修复）
          for pkg in $(git ls-files | grep -E '(^|/)package.json$' | grep -v '/scripts/'); do
            d=$(dirname "$pkg")
            for f in README.md CHANGELOG.md LICENSE; do
              if [ -f "$d/$f" ]; then :; else echo "缺少 $d/$f"; fail=1; fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "子项目必需文件齐备"
